<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060a">
<title>Castle Siege — Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<script src="three.min.js"></script>
<script src="models.js"></script>
<script src="art.js"></script>
<script src="icons.js"></script>
<style>
/* v3.29: Field Guide restyled to match the game's menus (same tokens as
   index_3d.html). One shared WebGL renderer draws every preview into
   its card's 2D canvas, so the page never exceeds the browser's WebGL
   context limit (13 live contexts used to blank cards on phones). */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#07060a;--line:rgba(217,178,95,.28);--line-2:rgba(217,178,95,.55);
  --gold:#d9b25f;--gold-b:#f6dc8e;--gold-w:#fff1c4;--gold-d:#8a6a2c;
  --parch:#e9dcc0;--parch-d:#a89878;--mute:#6f6556;
  --glass:linear-gradient(180deg,rgba(26,20,15,.92),rgba(11,9,7,.94));
  --shadow:0 10px 40px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.6);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --f-display:'Cinzel',Georgia,serif;--f-logo:'Cinzel Decorative','Cinzel',Georgia,serif;--f-body:'IM Fell English',Georgia,serif;
}
html{background:var(--ink)}
body{min-height:100vh;color:var(--parch);font-family:var(--f-body);font-size:15px;overflow-x:hidden;
  background:radial-gradient(ellipse 90% 60% at 50% 0%,#2a1e12 0%,#100c09 55%,#07060a 100%) fixed}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:overlay;z-index:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}
#embers{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.ember{position:absolute;bottom:-10px;border-radius:50%;background:#ffb85a;box-shadow:0 0 6px 2px rgba(255,140,40,.6);opacity:0;animation:ember linear infinite}
@keyframes ember{0%{transform:translate(0,0);opacity:0}10%{opacity:.8}80%{opacity:.4}100%{transform:translate(var(--dx),-105vh);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}

.wrap{position:relative;z-index:1;width:min(1240px,94vw);margin:0 auto}
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.kicker{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
.frame{position:relative}
.frame::after{content:'';position:absolute;inset:-1px;pointer-events:none;--c:var(--gold);--s:14px;--w:2px;z-index:3;
  background:linear-gradient(var(--c),var(--c)) top left/var(--s) var(--w) no-repeat,linear-gradient(var(--c),var(--c)) top left/var(--w) var(--s) no-repeat,
    linear-gradient(var(--c),var(--c)) top right/var(--s) var(--w) no-repeat,linear-gradient(var(--c),var(--c)) top right/var(--w) var(--s) no-repeat,
    linear-gradient(var(--c),var(--c)) bottom left/var(--s) var(--w) no-repeat,linear-gradient(var(--c),var(--c)) bottom left/var(--w) var(--s) no-repeat,
    linear-gradient(var(--c),var(--c)) bottom right/var(--s) var(--w) no-repeat,linear-gradient(var(--c),var(--c)) bottom right/var(--w) var(--s) no-repeat}
.btn{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--parch);text-decoration:none;
  background:linear-gradient(180deg,rgba(60,46,32,.85),rgba(22,17,12,.95));border:1px solid var(--gold-d);padding:.8em 1.4em;display:inline-flex;align-items:center;gap:.6em;
  box-shadow:inset 0 1px 0 rgba(255,230,170,.14),0 4px 14px rgba(0,0,0,.5);transition:all .2s var(--ease-out)}
.btn:hover{color:var(--gold-w);border-color:var(--gold);transform:translateY(-1px);box-shadow:0 0 22px rgba(217,178,95,.28),0 6px 16px rgba(0,0,0,.5)}

/* ---------- header ---------- */
header{padding:26px 0 18px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
header .btn{justify-self:start}
.title{text-align:center;animation:fadeUp .8s var(--ease-out) both}
.title h1{font-family:var(--f-logo);font-weight:900;font-size:clamp(34px,5.4vw,64px);line-height:1;letter-spacing:.06em;margin-top:6px;
  background:linear-gradient(100deg,#8a6a2c 0%,#f6dc8e 22%,#fff6d8 30%,#d9b25f 40%,#8a6a2c 55%,#e9c978 72%,#fff1c4 80%,#b68e3e 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #2a1d08) drop-shadow(0 6px 18px rgba(0,0,0,.8));animation:sheen 7s ease-in-out infinite}
.title p{font-style:italic;color:var(--parch-d);margin-top:8px;font-size:15px}
.hint{justify-self:end;font-family:var(--f-display);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);text-align:right;line-height:1.7}

/* ---------- tabs ---------- */
nav.tabs{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:2px;padding:10px 0;margin-bottom:22px;
  background:linear-gradient(180deg,rgba(7,6,10,.95),rgba(7,6,10,.82));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tab-btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:11px 20px;position:relative;font-family:var(--f-display);font-weight:700;font-size:13px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--parch-d);transition:color .2s}
.tab-btn .ico{font-size:17px;color:var(--gold-d);transition:color .2s}
.tab-btn .ct{font-size:10px;color:var(--mute);letter-spacing:.1em}
.tab-btn::after{content:'';position:absolute;left:14px;right:14px;bottom:-11px;height:2px;background:var(--gold-b);box-shadow:0 0 10px var(--gold);transform:scaleX(0);transition:transform .35s var(--ease-out)}
.tab-btn:hover{color:var(--parch)}.tab-btn:hover .ico{color:var(--gold)}
.tab-btn.active{color:var(--gold-w)}.tab-btn.active .ico{color:var(--gold-b)}.tab-btn.active::after{transform:scaleX(1)}
.tab-btn:focus-visible{outline:1px solid var(--gold);outline-offset:2px}

/* ---------- section intro ---------- */
.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:16px}
.intro h2{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,2.6vw,32px);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-b);
  text-shadow:0 0 22px rgba(217,178,95,.3),0 3px 0 #1a1206}
.intro p{font-style:italic;color:var(--parch-d);max-width:520px;text-align:right;line-height:1.5}

/* ---------- cards ---------- */
.tab-content{display:none}
.tab-content.active{display:block}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.card{display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);
  transition:border-color .3s,transform .4s var(--ease-out),box-shadow .3s;animation:fadeUp .6s var(--ease-out) both}
.card:hover{border-color:var(--line-2);transform:translateY(-3px);box-shadow:var(--shadow),0 0 30px rgba(217,178,95,.12)}
.card.boss::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;z-index:2;background:linear-gradient(90deg,transparent,var(--gold-b),transparent)}
.stage{position:relative;aspect-ratio:16/10;cursor:grab;touch-action:pan-y;overflow:hidden;
  background:radial-gradient(ellipse 60% 55% at 50% 62%,rgba(217,178,95,.16),transparent 70%),radial-gradient(ellipse at 50% 100%,#1c1510,#0b0907 70%)}
.stage:active{cursor:grabbing}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .chip{position:absolute;top:12px;left:12px;font-family:var(--f-display);font-weight:700;font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gold-b);padding:5px 10px;background:rgba(0,0,0,.55);border:1px solid var(--line)}
.card.boss .stage .chip{color:#140e05;background:linear-gradient(180deg,#f6dc8e,#c9993f);border-color:#ffe9a8}
.stage .drag{position:absolute;bottom:10px;right:12px;font-family:var(--f-display);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);opacity:0;transition:opacity .3s}
.card:hover .stage .drag{opacity:1}
.info{padding:16px 18px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;flex:1}
.info-head{display:flex;align-items:center;gap:12px}
.info-head>.ico{font-size:26px;color:var(--gold-b);flex:none;filter:drop-shadow(0 0 6px rgba(246,220,142,.35))}
.name{font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-w)}
.sub{font-family:var(--f-display);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--parch-d);margin-top:2px}
.cost{margin-left:auto;display:flex;align-items:center;gap:6px;padding:5px 12px 5px 7px;border:1px solid var(--line);border-radius:20px;background:rgba(0,0,0,.35);
  font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--gold-b);white-space:nowrap}
.cost svg{width:16px;height:16px}
.cost small{font-size:10px;color:var(--parch-d);margin-left:2px}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:7px 12px;align-items:center}
.stats span{font-family:var(--f-display);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--parch-d)}
.stats b{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--parch);text-align:right;min-width:3.2em}
.bar{height:5px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--gold-d),var(--gold-b));box-shadow:0 0 8px rgba(217,178,95,.5);
  width:0;transition:width 1s var(--ease-out)}
.card.shown .bar i{width:var(--v)}
.desc{font-style:italic;color:var(--parch);line-height:1.5;font-size:14.5px}
.ability{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:rgba(217,178,95,.07);border-left:2px solid var(--gold)}
.ability .ico{font-size:16px;color:var(--gold-b);flex:none;margin-top:2px}
.ability b{font-family:var(--f-display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-b);display:block;margin-bottom:2px}
.ability span{font-size:13.5px;color:var(--parch-d);line-height:1.45}

/* specials */
.medal{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  background:radial-gradient(ellipse 50% 60% at 50% 55%,var(--glow),transparent 70%),radial-gradient(ellipse at 50% 100%,#1c1510,#0b0907 70%)}
.medal .ring{width:118px;height:118px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--gold);background:radial-gradient(circle,#2a2016,#0d0a07);box-shadow:0 0 40px var(--glow),inset 0 0 20px rgba(0,0,0,.8);animation:pulse 3.2s ease-in-out infinite}
.medal .ring .ico{font-size:56px;color:var(--tint);filter:drop-shadow(0 0 12px var(--tint))}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

footer{position:relative;z-index:1;text-align:center;padding:40px 0 50px;font-family:var(--f-display);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}
footer a{color:var(--gold-d);text-decoration:none}footer a:hover{color:var(--gold)}

@media(max-width:760px){
  header{grid-template-columns:1fr;text-align:center;padding-top:18px}
  header .btn{justify-self:center;order:2}.hint{display:none}
  nav.tabs{justify-content:flex-start;overflow-x:auto;scrollbar-width:none;gap:0;padding:6px 0}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab-btn{padding:10px 14px;font-size:11px;flex:none}.tab-btn .ct{display:none}
  .tab-btn::after{bottom:-6px}
  .intro{flex-direction:column;align-items:flex-start}.intro p{text-align:left}
  .card-grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="embers"></div>
<div class="wrap">
  <header>
    <a class="btn" href="index_3d.html">&larr; Return to Battle</a>
    <div class="title"><div class="kicker">Codex of War</div><h1>Field Guide</h1><p>Every tower, soldier and terror of the siege.</p></div>
    <div class="hint">Drag to rotate<br>Scroll or pinch to zoom</div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="sections"></main>
</div>
<footer>Castle Siege &bull; Field Guide &bull; <a href="index_3d.html">Play</a></footer>

<script>
'use strict';
// ==================== DATA ====================
// Mirrors TOWER_DATA / ENEMY_DATA / BOSS_DATA / SPECIAL_DATA in index_3d.html.
const SECTIONS=[
  {id:'towers',label:'Towers',chip:'Tower',icon:'turret',title:'Towers',blurb:'Built on your side of the field. Place a tower on your own tower to upgrade it — up to level 3.',
   bars:{dmg:['Damage',60],range:['Range',5.5],fire:['Fire Rate',1.25],splash:['Splash',2]},
   items:[
    {model:'tower-turret',icon:'turret',name:'Turret',sub:'Arrow Tower',cost:100,dmg:15,range:4,fire:1/0.8,splash:0,
     desc:'Fast-firing arrow tower. Cheap, reliable single-target damage that never misses a beat.'},
    {model:'tower-magic',icon:'magic',name:'Magic Tower',sub:'Arcane Spire',cost:175,dmg:32,range:3.5,fire:1,splash:1.8,
     desc:'Hurls arcane orbs that burst on impact, scorching every foe around the target.'},
    {model:'tower-catapult',icon:'catapult',name:'Catapult',sub:'Siege Engine',cost:150,dmg:55,range:5.5,fire:1/2.5,splash:2,
     desc:'The longest reach on the field. Slow, heavy boulders that flatten whole squads.'},
    {model:'tower-bombard',icon:'bombard',name:'Bombard',sub:'Heavy Cannon',cost:200,dmg:60,range:4.5,fire:1/2,splash:0,
     desc:'Punishing single-target cannon fire. The answer to armored knights and bosses.'},
    {model:'tower-banner',icon:'banner',name:'War Banner',sub:'Support Standard',cost:150,dmg:0,range:2.2,fire:0,splash:0,
     desc:'Fires nothing. Rallies every friendly tower within reach: +25% damage, +10% per level. Plant it behind your front line.'},
  ]},
  {id:'walls',label:'Fortifications',chip:'Fortification',icon:'wall',title:'Fortifications',blurb:'Walls never block your own army — only the enemy\'s. Lengthen their march and keep them under your towers.',
   bars:{hp:['Health',150]},
   items:[
    {model:'wall',icon:'wall',name:'Wall',sub:'Stone Blocker',cost:30,hp:150,
     desc:'Stone fortification for building mazes. Foot soldiers on a long march may hurl themselves at it to break through.'},
    {model:'barricade',icon:'barricade',name:'Barricade',sub:'Wooden Spikes',cost:15,hp:75,
     desc:'Half the price, half the strength. Perfect for quickly closing a gap.'},
  ]},
  {id:'armies',label:'Armies',chip:'Squad of 10',icon:'knight',title:'Armies',blurb:'Bought in squads of ten during the build phase. They march on the enemy castle at the start of the next wave.',
   bars:{hp:['Health',80],spd:['Speed',2.5],dmg:['Damage',38],armor:['Armor',100]},
   items:[
    {model:'enemy-goblin',icon:'goblin',name:'Goblin',sub:'Swarm',cost:60,squad:true,hp:30,spd:2.5,dmg:15,armor:0,
     desc:'Fast and cheap. Overwhelms defenses with sheer numbers.'},
    {model:'enemy-orc',icon:'orc',name:'Orc',sub:'Bruiser',cost:100,squad:true,hp:80,spd:1.2,dmg:38,armor:0,
     desc:'Slow but tough, and hits hard in melee.'},
    {model:'enemy-darkKnight',icon:'knight',name:'Dark Knight',sub:'Heavy Infantry',cost:160,squad:true,hp:60,spd:1.8,dmg:30,armor:50,
     desc:'Plate armor shrugs off half of all damage. Bring a bombard.'},
    {model:'enemy-archer',icon:'archer',name:'Archer',sub:'Skirmisher',cost:120,squad:true,hp:40,spd:2.0,dmg:23,armor:0,
     ability:['Ranged','Looses arrows at enemy units up to 3.5 tiles away while marching — and can shoot down dragons.'],
     desc:'Fragile, but thins out enemy columns before they ever reach melee.'},
  ]},
  {id:'bosses',label:'Bosses',chip:'Boss',icon:'dragon',title:'Bosses',blurb:'Single elite units, purchased one at a time. They take the field last, once the rest of the wave has marched.',
   bars:{hp:['Health',800],spd:['Speed',2.2],dmg:['Damage',300],armor:['Armor',100]},
   items:[
    {model:'enemy-troll',icon:'troll',name:'Troll',sub:'Wall Breaker',cost:200,boss:true,hp:800,spd:0.8,dmg:300,armor:30,
     ability:['Smash','Batters straight through any wall in its way and keeps marching. Mazes will not hold it.'],
     desc:'A mountain of muscle. One crushing blow deletes any regular unit.'},
    {model:'enemy-dragon',icon:'dragon',name:'Dragon',sub:'Sky Terror',cost:250,boss:true,hp:500,spd:2.2,dmg:220,armor:20,
     ability:['Flight','Soars over walls and towers on a straight line to your gates. Ground melee cannot reach it.'],
     desc:'Fast, savage and unstoppable by fortifications. Only towers and archers bring it down.'},
    {model:'enemy-lich',icon:'lich',name:'Lich',sub:'Necromancer',cost:300,boss:true,hp:700,spd:1.0,dmg:180,armor:55,
     ability:['Death Aura','Every 1.5s, mends allied units within 2.5 tiles for 8% of their health.'],
     desc:'Heavily warded and slow. Kill it first, or the whole column keeps marching.'},
  ]},
  {id:'specials',label:'Specials',icon:'meteor',title:'Specials',blurb:'Three charges per round, cast only during combat. Aim with your cursor, then unleash.',
   items:[
    {special:true,icon:'meteor',name:'Meteor',sub:'Area Strike',tint:'#ffa060',glow:'rgba(255,120,40,.35)',stats:[['Damage','140'],['Radius','3 tiles']],
     desc:'Calls a volley of burning rock down on the target, devastating clustered enemies.'},
    {special:true,icon:'lightning',name:'Lightning',sub:'Chain Bolt',tint:'#bcd8ff',glow:'rgba(140,180,255,.35)',stats:[['Damage','50 each'],['Chains','5 enemies']],
     desc:'A bolt that leaps from foe to foe, striking five in quick succession.'},
    {special:true,icon:'freeze',name:'Freeze',sub:'Frost Wave',tint:'#8ee8ff',glow:'rgba(120,220,255,.3)',stats:[['Slow','to 30%'],['Duration','5s'],['Radius','4 tiles']],
     desc:'Chills everything in the area to a crawl, buying your towers time.'},
    {special:true,icon:'heal',name:'Heal',sub:'Restoration',tint:'#8af0a0',glow:'rgba(110,230,140,.3)',stats:[['Restore','500 HP']],
     desc:'Mends your castle walls. Worth saving for the late waves.'},
  ]},
];

// ==================== BUILD DOM ====================
const icon=(id)=>`<svg class="ico" viewBox="0 0 24 24"><use href="#i-${id}"/></svg>`;
const coin='<svg viewBox="0 0 24 24"><use href="#i-coin"/></svg>';
const tabsEl=document.getElementById('tabs'),secEl=document.getElementById('sections');
SECTIONS.forEach((sec,si)=>{
  const tb=document.createElement('button');
  tb.className='tab-btn';tb.dataset.tab=sec.id;
  tb.innerHTML=`${icon(sec.icon)}<span>${sec.label}</span><span class="ct">${sec.items.length}</span>`;
  tabsEl.appendChild(tb);
  const box=document.createElement('section');
  box.className='tab-content';box.id='tab-'+sec.id;
  box.innerHTML=`<div class="intro"><h2>${sec.title}</h2><p>${sec.blurb}</p></div><div class="card-grid"></div>`;
  const grid=box.querySelector('.card-grid');
  sec.items.forEach((it,ii)=>{
    const c=document.createElement('article');
    c.className='card frame'+(it.boss?' boss':'')+(it.special?' special':'');
    c.style.animationDelay=(ii*0.07)+'s';
    const costHTML=it.cost?`<div class="cost">${coin}$${it.cost}${it.squad?'<small>/ 10</small>':''}</div>`:'';
    let statsHTML='';
    if(sec.bars){
      statsHTML='<div class="stats">'+Object.entries(sec.bars).map(([k,[lab,max]])=>{
        const v=it[k];const txt=(v===0&&k!=='armor')?'—':k==='fire'?v.toFixed(2)+'/s':k==='armor'?v+'%':v;
        return `<span>${lab}</span><div class="bar"><i style="--v:${Math.min(100,(v||0)/max*100)}%"></i></div><b>${txt}</b>`;
      }).join('')+'</div>';
    }else if(it.stats){
      statsHTML='<div class="stats">'+it.stats.map(([a,b])=>`<span>${a}</span><div></div><b>${b}</b>`).join('')+'</div>';
    }
    const ab=it.ability?`<div class="ability">${icon('warn')}<div><b>${it.ability[0]}</b><span>${it.ability[1]}</span></div></div>`:'';
    const stage=it.special
      ?`<div class="medal" style="--tint:${it.tint};--glow:${it.glow}"><div class="ring">${icon(it.icon)}</div></div>`
      :`<div class="stage" data-model="${it.model}"><canvas></canvas><span class="chip">${sec.chip}</span><span class="drag">Drag &middot; Zoom</span></div>`;
    c.innerHTML=`${stage}<div class="info"><div class="info-head">${icon(it.icon)}<div><div class="name">${it.name}</div><div class="sub">${it.sub}</div></div>${costHTML}</div>
      ${statsHTML}${ab}<p class="desc">${it.desc}</p></div>`;
    grid.appendChild(c);
  });
  secEl.appendChild(box);
});
// Embers
for(let i=0;i<26;i++){
  const e=document.createElement('i');e.className='ember';const d=8+Math.random()*10,s=1.5+Math.random()*2.5;
  e.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;--dx:${(Math.random()-.5)*160}px;animation-duration:${d}s;animation-delay:${-Math.random()*d}s`;
  document.getElementById('embers').appendChild(e);
}

// ==================== TABS ====================
// Stat bars fill as cards scroll into view; previews render only while visible.
const io=new IntersectionObserver(es=>es.forEach(en=>{en.target._vis=en.isIntersecting;if(en.isIntersecting)en.target.classList.add('shown')}),{rootMargin:'80px'});
document.querySelectorAll('.card').forEach(c=>io.observe(c));
function showTab(id){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id==='tab-'+id));
  if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);
  const ab=document.querySelector('.tab-btn.active');
  if(ab&&tabsEl.scrollWidth>tabsEl.clientWidth)tabsEl.scrollTo({left:ab.offsetLeft-tabsEl.clientWidth/2+ab.offsetWidth/2,behavior:'smooth'});
}
tabsEl.addEventListener('click',e=>{const b=e.target.closest('.tab-btn');if(b)showTab(b.dataset.tab)});
window.addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  const ids=SECTIONS.map(s=>s.id),cur=ids.indexOf(document.querySelector('.tab-btn.active').dataset.tab);
  showTab(ids[(cur+(e.key==='ArrowRight'?1:-1)+ids.length)%ids.length]);
});
const start=(location.hash||'').slice(1);
showTab(SECTIONS.some(s=>s.id===start)?start:'towers');

// ==================== SHARED 3D RENDERER ====================
let renderer=null;
try{
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
  renderer.setClearColor(0x000000,0);
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
}catch(e){renderer=null}
const DPR=Math.min(window.devicePixelRatio||1,2);
const viewers=[];
const __rs=new THREE.Vector2();

function buildModel(type){
  const owner=1;
  switch(type){
    case 'tower-turret':return createTower('turret',owner);
    case 'tower-magic':return createTower('magic',owner);
    case 'tower-catapult':return createTower('catapult',owner);
    case 'tower-bombard':return createTower('bombard',owner);
    case 'tower-banner':return createTower('banner',owner);
    case 'wall':return createWall(owner);
    case 'barricade':return createBarricade(owner);
  }
  return createEnemyModel(type.slice(6),owner);
}
function createViewer(stage){
  const type=stage.dataset.model,canvas=stage.querySelector('canvas'),card=stage.closest('.card');
  const scene=new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffe8c0,0x2a1e14,0.75));
  const key=new THREE.DirectionalLight(0xfff0d8,1.5);key.position.set(3,6,4);key.castShadow=true;
  key.shadow.mapSize.set(1024,1024);key.shadow.bias=-0.0005;scene.add(key);
  const rim=new THREE.DirectionalLight(0xffc870,0.8);rim.position.set(-4,3,-4);scene.add(rim);
  const fill=new THREE.DirectionalLight(0x8aa8ff,0.3);fill.position.set(-3,2,4);scene.add(fill);

  const model=buildModel(type);
  if(type.indexOf('enemy-')===0){
    // models.js returns enemies at game scale facing sideways; face the viewer.
    model.rotation.set(0,0,0);model.scale.setScalar(1.6);
    const limbs=[];
    model.traverse(c=>{
      if(c.isGroup&&c.userData&&c.userData.limb){
        const l=c.userData.limb;
        const t=l==='leftLeg'?0:l==='rightLeg'?1:l==='leftArm'?2:l==='rightArm'?3:l==='head'?4:l==='tail'?5:l==='weapon'?6:l==='neck'?7:-1;
        if(t>=0)limbs.push({grp:c,type:t});
      }
    });
    model.userData.limbs=limbs;
  }
  scene.add(model);
  model.traverse(o=>{if(o.isMesh)o.castShadow=true});
  // Auto-frame from the bounding box so no model is cropped.
  model.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),ctr=box.getCenter(new THREE.Vector3());
  const footR=Math.max(size.x,size.z)*0.5;
  const pr=footR*1.25+0.15;
  const ped=new THREE.Mesh(new THREE.CylinderGeometry(pr,pr*1.05,0.06,48),new THREE.MeshStandardMaterial({color:0x2a2119,roughness:0.85,metalness:0.1}));
  ped.position.set(ctr.x,box.min.y-0.03,ctr.z);ped.receiveShadow=true;scene.add(ped);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(pr*1.02,0.012,6,64),new THREE.MeshStandardMaterial({color:0xd9b25f,emissive:0x5a400f,metalness:0.8,roughness:0.3}));
  ring.rotation.x=Math.PI/2;ring.position.set(ctr.x,box.min.y,ctr.z);scene.add(ring);
  const sphereR=Math.max(size.length()*0.5,pr);
  const camera=new THREE.PerspectiveCamera(32,16/10,0.05,100);
  // Long, low models (the dragon's tail) frame on height+depth so they don't shrink to a speck.
  const dist=sphereR/Math.sin(32*Math.PI/360)*(size.y<Math.max(size.x,size.z)*0.6?0.72:0.92);
  const v={stage,card,canvas,ctx:canvas.getContext('2d'),scene,camera,model,
    theta:0.6,phi:1.2,dist,baseDist:dist,target:new THREE.Vector3(ctr.x,ctr.y-size.y*0.04,ctr.z),
    autoRotate:true,dragging:false,lastX:0,lastY:0,pinch:0,anim:Math.random()*6};
  stage.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!e.isPrimary)return;v.dragging=true;v.autoRotate=false;v.lastX=e.clientX;v.lastY=e.clientY;try{stage.setPointerCapture(e.pointerId)}catch(_){}});
  stage.addEventListener('pointermove',e=>{if(!v.dragging)return;v.theta-=(e.clientX-v.lastX)*0.01;v.phi-=(e.clientY-v.lastY)*0.008;v.lastX=e.clientX;v.lastY=e.clientY});
  const up=()=>{v.dragging=false;clearTimeout(v._t);v._t=setTimeout(()=>{v.autoRotate=true},3500)};
  stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
  stage.addEventListener('wheel',e=>{v.dist=Math.max(v.baseDist*0.55,Math.min(v.baseDist*1.8,v.dist*(1+e.deltaY*0.001)));e.preventDefault()},{passive:false});
  stage.addEventListener('touchmove',e=>{
    if(e.touches.length!==2)return;
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(v.pinch)v.dist=Math.max(v.baseDist*0.55,Math.min(v.baseDist*1.8,v.dist*v.pinch/d));v.pinch=d;e.preventDefault();
  },{passive:false});
  stage.addEventListener('touchend',()=>{v.pinch=0});
  stage.addEventListener('dblclick',()=>{v.dist=v.baseDist;v.phi=1.2});
  viewers.push(v);
}

function animateLimbs(v,dt){
  const limbs=v.model.userData.limbs;if(!limbs)return;
  v.anim+=dt*3;const a=v.anim,s=Math.sin(a),s2=Math.sin(a*0.55+0.7);
  for(const L of limbs){
    switch(L.type){
      case 0:L.grp.rotation.x=s*0.4;break;case 1:L.grp.rotation.x=-s*0.4;break;
      case 2:L.grp.rotation.x=-s*0.3;break;case 3:L.grp.rotation.x=s*0.3;break;
      case 4:L.grp.rotation.x=s2*0.18;break;case 5:L.grp.rotation.y=s*0.35;L.grp.rotation.x=s2*0.08;break;
      case 6:L.grp.rotation.x=s*0.25;break;case 7:L.grp.rotation.x=s2*0.22-0.05;break;
    }
  }
}
let last=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(t-last)/1000||0);last=t;
  if(!renderer)return;
  for(const v of viewers){
    if(!v.card._vis||v.stage.offsetWidth===0)continue;
    const w=Math.round(v.stage.clientWidth*DPR),h=Math.round(v.stage.clientHeight*DPR);
    if(!w||!h)continue;
    if(v.canvas.width!==w||v.canvas.height!==h){v.canvas.width=w;v.canvas.height=h}
    renderer.getSize(__rs);
    if(__rs.x!==w||__rs.y!==h)renderer.setSize(w,h,false);
    if(v.autoRotate)v.theta+=dt*0.35;
    animateLimbs(v,dt);
    v.phi=Math.max(0.4,Math.min(1.45,v.phi));
    v.camera.aspect=w/h;v.camera.updateProjectionMatrix();
    v.camera.position.set(v.target.x+v.dist*Math.sin(v.phi)*Math.cos(v.theta),v.target.y+v.dist*Math.cos(v.phi),v.target.z+v.dist*Math.sin(v.phi)*Math.sin(v.theta));
    v.camera.lookAt(v.target);
    renderer.render(v.scene,v.camera);
    v.ctx.clearRect(0,0,w,h);v.ctx.drawImage(renderer.domElement,0,0,w,h);
  }
}
document.querySelectorAll('.stage[data-model]').forEach(createViewer);
requestAnimationFrame(frame);
</script>
</body>
</html>
